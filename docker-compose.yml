services:
  db:
    image: postgres:16
    env_file: .env
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./sql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 3s
      retries: 10
  adminer:
    image: adminer
    ports:
      - "8080:8080"
    depends_on:
      - db
  etl:
    build: ./etl
    env_file: .env
    volumes:
      - ./etl:/app
      - ./data:/data
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata: