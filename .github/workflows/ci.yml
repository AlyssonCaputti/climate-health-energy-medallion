name: CI/CD

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # 1) Código: lint e testes. Rápido e sem banco, porque as transformações são funções puras.
  qualidade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: etl/requirements.txt
      - run: pip install -r etl/requirements.txt ruff
      - run: ruff check etl
      - run: python -m pytest -v
        working-directory: etl

  # 2) Infra: o compose é válido, a imagem builda e o banco sobe com as camadas criadas.
  docker:
    needs: qualidade
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cp .env.example .env
      - run: docker compose config --quiet
      - run: docker compose build etl
      - name: Banco sobe com bronze, silver e gold
        run: |
          docker compose up -d --wait db
          docker compose exec -T db psql -U etl -d dw -Atc "SELECT string_agg(schema_name, ',' ORDER BY schema_name) FROM information_schema.schemata WHERE schema_name IN ('bronze','silver','gold')" | grep -x "bronze,gold,silver"

  # 3) Entrega: a cada push na main, publico a imagem do ETL no GitHub Container Registry.
  publicar:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: docker
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # O registry só aceita nome em minúsculas, por isso o owner vai escrito à mão.
      - uses: docker/build-push-action@v6
        with:
          context: ./etl
          push: true
          tags: |
            ghcr.io/alyssoncaputti/climate-health-energy-medallion-etl:latest
            ghcr.io/alyssoncaputti/climate-health-energy-medallion-etl:${{ github.sha }}
